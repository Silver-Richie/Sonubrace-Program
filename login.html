<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Sonubrace</title>
<meta name="description" content="Sign in to your Sonubrace account to open the monitor and review your saved Doppler recordings.">
<link rel="canonical" href="https://YOUR-USERNAME.github.io/sonubrace/login.html">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#06657f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2306657f'/%3E%3Cpath d='M6 20c3-8 5 6 8-2s5 6 8-4' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/sonubrace.css">
<script>try{var t=localStorage.getItem('sonubrace.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>

<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header" data-sonubrace-header></header>

<main id="main">
  <div class="wrap-narrow stack">

    <h1>Sign in</h1>

    <div class="card">
      <form id="login-form" novalidate>
        <div data-error-summary hidden></div>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" required autofocus>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-lg btn-block" id="submit">Sign in</button>
      </form>

      <p class="small mt-2 mb-0">
        <button type="button" class="btn btn-ghost btn-sm" id="reset">Forgot your password?</button>
      </p>
    </div>

    <p class="center">New here? <a href="register.html">Create an account</a></p>

  </div>
</main>

<footer class="site-footer" data-sonubrace-footer></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  'use strict';
  var UI = SonubraceUI, DB = SonubraceDB;

  /* Only same-page targets are accepted, so `next` cannot be used to bounce a
     signed-in user to an off-site URL. */
  function safeNext() {
    var n = UI.qs('next');
    return /^[a-z0-9_-]+\.html$/i.test(n) ? n : 'app.html';
  }

  UI.boot().then(function (user) {
    if (user) location.replace(safeNext());
  });

  var form = document.getElementById('login-form');
  var submit = document.getElementById('submit');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    UI.clearFieldErrors(form);

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    if (!email || !password) {
      UI.showFormErrors(form, [{ id: 'email', message: 'Enter your email and password.' }]);
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Signing in…';

    DB.signIn(email, password)
      .then(function () { location.href = safeNext(); })
      .catch(function (err) {
        UI.showFormErrors(form, [{ id: 'email', message: err.message }]);
        submit.disabled = false;
        submit.textContent = 'Sign in';
      });
  });

  document.getElementById('reset').addEventListener('click', function () {
    var email = document.getElementById('email').value.trim();
    if (!email) {
      UI.toast('Enter your email address first, then choose reset.', 'warn');
      document.getElementById('email').focus();
      return;
    }
    DB.requestPasswordReset(email)
      .then(function () { UI.toast('If that address has an account, a reset link is on its way.', 'ok', 8000); })
      .catch(function (err) { UI.toast(err.message, 'warn', 9000); });
  });
})();
</script>
</body>
</html>
